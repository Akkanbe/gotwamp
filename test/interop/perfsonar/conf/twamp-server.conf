# twampd configuration for the gotwamp interoperability tests.
# twampd runs as root inside the container (-f) and in the foreground (-Z),
# so no user, group or syslog settings are needed.
verbose
loglocation
vardir		/var/run
datadir		/var/lib/twamp
# Test ports for Session-Reflectors. gotwamp requests its own Sender Port,
# which lies outside this range, so twampd answers with an alternate port.
testports	18760-19960
# REFWAIT (seconds) and the wait after Stop-Sessions.
testtimeout	900
