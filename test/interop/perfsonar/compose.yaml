# perfSONAR testpoint for the gotwamp interoperability tests (PLAN §8).
#
# twampd runs in the foreground on the host network, so that gotwamp on the
# host reaches it on loopback and twping in the container reaches gotwampd
# the same way, over IPv4 and IPv6, without port mapping.
name: gotwamp-interop
services:
  perfsonar:
    image: ${PERFSONAR_IMAGE:-perfsonar/testpoint:latest}
    container_name: ${PERFSONAR_CONTAINER:-gotwamp-perfsonar}
    network_mode: host
    entrypoint: ["/usr/sbin/twampd"]
    command:
      - "-Z"    # stay in the foreground
      - "-f"    # allow running as root
      - "-a"
      - "AEMO"  # authenticated, encrypted, mixed and open; keys in twamp-server.pfs
      - "-c"
      - "/etc/gotwamp-interop"
      - "-S"
      - "${PERFSONAR_TWAMPD_LISTEN:-[::]:862}"
    volumes:
      # twampd reads twamp-server.{conf,limits,pfs} from -c; the keys file
      # carries TEST ONLY in its name.
      - ./conf/twamp-server.conf:/etc/gotwamp-interop/twamp-server.conf:ro
      - ./conf/twamp-server.limits:/etc/gotwamp-interop/twamp-server.limits:ro
      - ./conf/twamp-server-test-only.pfs:/etc/gotwamp-interop/twamp-server.pfs:ro
    healthcheck:
      test: ["CMD-SHELL", "twping -c 1 -i 0.1 -L 2 -Q localhost:$${PERFSONAR_TWAMPD_PORT:-862}"]
      interval: 2s
      timeout: 10s
      retries: 15
    environment:
      PERFSONAR_TWAMPD_PORT: ${PERFSONAR_TWAMPD_PORT:-862}
