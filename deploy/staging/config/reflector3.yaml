# gotwampd of staging reflector3 (docs/ops/staging.md).
version: 1

daemon:
  api:
    socket: /run/gotwamp/gotwampd.sock
    socket_group: ""
  metrics:
    listen: "[::]:9862"
  log:
    level: info
    format: text

sender:
  enabled: false

reflector:
  enabled: true
  control:
    listen: ["0.0.0.0:862", "[::]:862"]
    extensions: [individual_session_control, reflect_octets, symmetrical_size]
  light:
    listeners:
      - listen: "0.0.0.0:862"
      - listen: "[::]:862"
    stamp: true                      # STAMP (RFC 8762/8972); TWAMP Light senders are answered as before
